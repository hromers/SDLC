<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510"><rect width="100%" height="100%" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs><text x="34" y="44.0" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17202a">Состояния интерфейса</text><rect x="34" y="88" width="510" height="245" rx="7" fill="#fafafa" stroke="#475569" stroke-width="1.5"/><rect x="34" y="88" width="510" height="42" rx="7" fill="#e9ecef" stroke="#475569" stroke-width="1.5"/><text x="54" y="116.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17202a">До расчета</text><text x="54" y="173.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Данные еще не введены</text><text x="54" y="200.55" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Введите данные для расчета</text><text x="54" y="228.1" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Доступна кнопка «Ввод данных»</text><rect x="372" y="272" width="145" height="38" rx="7" fill="#e3edf8" stroke="#475569" stroke-width="1.5"/><text x="403" y="298.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17202a">Ввод / OK</text><rect x="576" y="88" width="510" height="245" rx="7" fill="#fafafa" stroke="#475569" stroke-width="1.5"/><rect x="576" y="88" width="510" height="42" rx="7" fill="#e9ecef" stroke="#475569" stroke-width="1.5"/><text x="596" y="116.0" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17202a">Ошибка ввода</text><text x="596" y="173.0" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Возраст должен быть от 1 до 120 лет.</text><text x="596" y="200.55" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Форма остается открытой.</text><text x="596" y="228.1" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17202a">Предыдущий результат сохраняется.</text><rect x="914" y="272" width="145" height="38" rx="7" fill="#e3edf8" stroke="#475569" stroke-width="1.5"/><text x="945" y="298.0" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17202a">Ввод / OK</text><text x="34" y="382.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17202a">Отмена: закрыть форму, не менять исходные данные и результат.</text><text x="34" y="422.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17202a">Повторный расчет: подставить последние принятые значения.</text><text x="34" y="462.0" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17202a">Выбор тренажера меняет подпись, но не коэффициенты формулы.</text></svg>